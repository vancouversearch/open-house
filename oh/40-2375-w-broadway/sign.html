<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Open House QR Sign</title>
<!-- Printable door sign, letter size. Everything comes from config.js; nothing to edit here.
     Print: Chrome > Print > Save as PDF, Margins: None, Background graphics: on. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500&family=Poppins:wght@400;600&display=swap">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  @page { size: 8.5in 11in; margin: 0; }
  :root { --bg: #F5F0E6; --ink: #1A1714; --muted: #77706A; --rule: #D9D1C4; --rust: #B65B35; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #E9E3D7; }
  body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .page { position: relative; width: 816px; height: 1056px; margin: 24px auto; background: var(--bg); color: var(--ink); font-family: 'Poppins', 'Helvetica Neue', Arial, sans-serif; overflow: hidden; }
  .card { position: absolute; inset: 30px; border: 1.5px solid var(--rule); border-radius: 10px; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 44px 70px 0; }
  .eyebrow { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .12em; color: var(--rust); }
  h1 { margin: 18px 0 0; font-family: 'Lora', Georgia, serif; font-weight: 500; font-size: 50px; line-height: 1.05; }
  .area { margin: 10px 0 0; font-size: 15px; color: var(--muted); }
  .qr { margin-top: 30px; width: 400px; height: 400px; padding: 38px; border: 1.5px solid var(--rule); }
  .qr svg { width: 100%; height: 100%; display: block; }
  .scan { margin: 26px 0 0; font-size: 15px; font-weight: 600; letter-spacing: .04em; }
  .feat { margin: 8px 0 0; font-size: 13px; line-height: 1.6; color: var(--muted); }
  .stats { margin-top: 26px; width: 100%; border-top: 1.5px solid var(--rule); border-bottom: 1.5px solid var(--rule); display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); padding: 16px 0; font-size: 14px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  .foot { margin-top: 34px; width: 100%; display: flex; align-items: center; justify-content: space-between; }
  .chris { height: 64px; width: auto; display: block; }
  .rule { width: 1.5px; align-self: stretch; background: var(--rust); }
  .contact { text-align: left; font-size: 13.5px; line-height: 1.75; color: var(--muted); }
  .oak { height: 96px; width: auto; display: block; }
  .print { display: block; margin: 16px auto 0; padding: 10px 20px; font: 600 15px 'Poppins', sans-serif; }
  @media print { html, body { background: var(--bg); } .page { margin: 0; } .print { display: none; } }
</style>
</head>
<body>
<button class="print" onclick="print()">Print</button>
<div class="page"><div class="card">
  <p class="eyebrow">OPEN HOUSE</p>
  <h1 id="addr"></h1>
  <p class="area" id="area"></p>
  <div class="qr" id="qr"></div>
  <p class="scan">SCAN TO SIGN IN &amp; VIEW PROPERTY DETAILS</p>
  <p class="feat"><span id="feat"></span><br>Includes a free Vancouver buyer’s guide.</p>
  <div class="stats" id="stats"></div>
  <div class="foot">
    <img class="chris" src="../../assets/logos/chris-zenone-logo-black.png" alt="Chris Zenone">
    <span class="rule" aria-hidden="true"></span>
    <div class="contact"><span id="phone"></span><br><span id="email"></span></div>
    <span class="rule" aria-hidden="true"></span>
    <img class="oak" src="../../assets/logos/oakwyn-logo-dark.png" alt="Oakwyn Realty">
  </div>
</div></div>
<script>
  const OH = window.OH, S = OH.sign || {}, $ = id => document.getElementById(id);
  $('addr').textContent = OH.address;
  $('area').textContent = S.areaLine || (OH.area + ' · Vancouver');
  $('feat').textContent = S.features || 'Strata fee & taxes · Strata documents';
  const price = '$' + Number(OH.price).toLocaleString('en-CA');
  (S.stats || []).concat(price).forEach(t => { const s = document.createElement('span'); s.textContent = t; $('stats').append(s); });
  $('phone').textContent = OH.host.phoneDisplay;
  $('email').textContent = OH.host.email;
  // QR as crisp vector squares. Points at this listing's page, tagged so sign scans show up as "sign".
  const q = qrcode(0, 'M'); q.addData(OH.url + '?src=sign'); q.make();
  const n = q.getModuleCount(), NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${n} ${n}`); svg.setAttribute('shape-rendering', 'crispEdges');
  svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', 'QR code to sign in');
  const g = document.createElementNS(NS, 'g'); g.setAttribute('fill', '#1A1714');
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) {
    const rect = document.createElementNS(NS, 'rect');
    rect.setAttribute('x', c); rect.setAttribute('y', r); rect.setAttribute('width', 1); rect.setAttribute('height', 1);
    g.append(rect);
  }
  svg.append(g); $('qr').append(svg);
</script>
</body>
</html>
