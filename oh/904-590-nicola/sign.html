<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Open House QR Sign</title>
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  @page { size: letter portrait; margin: 0.5in; }
  :root { --ink: #000; --paper: #fff; --serif: "Iowan Old Style", Palatino, Georgia, serif; --sans: -apple-system, "Helvetica Neue", Arial, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); }
  .sheet { width: 7.5in; min-height: 10in; margin: 0 auto; padding: 0.3in 0; display: flex; flex-direction: column; align-items: center; text-align: center; }
  h1 { font: 500 44px/1.15 var(--serif); margin: 0 0 6px; }
  .addr { font-size: 22px; margin: 0 0 0.35in; }
  #qr { width: 5in; height: 5in; }
  #qr img, #qr canvas { width: 100% !important; height: 100% !important; image-rendering: pixelated; }
  .url { font: 600 17px/1.3 ui-monospace, Menlo, monospace; margin: 0.2in 0 0; word-break: break-all; }
  .who { margin-top: auto; padding-top: 0.3in; border-top: 2px solid var(--ink); width: 100%; font-size: 20px; }
  .who strong { font: 500 26px var(--serif); display: block; }
  .print { margin: 16px; padding: 12px 22px; font-size: 16px; }
  @media print { .print { display: none; } .sheet { padding: 0; } }
  @media screen and (max-width: 8in) { .sheet { width: auto; padding: 16px; } #qr { width: min(5in, 100%); height: auto; aspect-ratio: 1; } h1 { font-size: 32px; } }
</style>
</head>
<body>
<button class="print" onclick="print()">Print</button>
<div class="sheet">
  <h1>Scan to sign in + get a free Buyer's Guide</h1>
  <p class="addr" id="addr"></p>
  <div id="qr"></div>
  <p class="url" id="url"></p>
  <div class="who"><strong id="name"></strong><span id="brokerage"></span></div>
</div>
<script>
  const OH = window.OH, $ = id => document.getElementById(id);
  const target = OH.url + '?src=sign';
  $('addr').innerHTML = '';
  $('addr').append(OH.address + ', ' + OH.area, document.createElement('br'), 'Open house ' + OH.openHouse);
  $('url').textContent = OH.url.replace(/^https?:\/\//, '');
  $('name').textContent = OH.host.name;
  $('brokerage').textContent = OH.host.brokerage;
  new QRCode($('qr'), { text: target, width: 960, height: 960, colorDark: '#000000', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
</script>
</body>
</html>
